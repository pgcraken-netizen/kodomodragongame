<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e5"><title>子どもドラゴンのワクワクタウン</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ec;color:#43372f;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;cursor:pointer;border:0}#app{max-width:520px;margin:auto;min-height:100dvh;background:#fffdf5;overflow:hidden;position:relative}.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#fff8e7}.brand{font-weight:900;color:#0876c9;font-size:20px;text-shadow:1px 2px #fff}.small{font-size:12px}.pill{background:#fff;border:2px solid #f8bf50;border-radius:30px;padding:6px 12px;font-weight:bold}.map{border:5px solid #f8ca76;border-radius:20px;margin:4px 8px;height:58dvh;min-height:420px;max-height:680px;position:relative;overflow:hidden;background:repeating-linear-gradient(40deg,#ccecb0 0 30px,#d5efb8 30px 60px);touch-action:none}.world{position:absolute;width:780px;height:780px;transform-origin:0 0}.road{position:absolute;background:#f5dba6;border:4px dashed #e9c48d;border-radius:60px}.road.a{left:365px;top:0;width:80px;height:780px}.road.b{left:0;top:370px;width:780px;height:75px}.spot{position:absolute;width:146px;height:118px;border:4px solid #fff;border-radius:20px;box-shadow:0 5px 0 #9eb88e;background:#fff9e5;text-align:center;padding:10px 4px;color:#514030;font-weight:900;font-size:14px}.spot .emoji{font-size:43px;display:block}.town-art{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 0 #8ea56c)}.spot:active{transform:scale(.96)}.tree{position:absolute;font-size:36px;pointer-events:none}.dragon{position:absolute;width:92px;height:95px;transition:left .55s linear,top .55s linear;filter:drop-shadow(0 5px 1px #6b9b6780);pointer-events:none}.dragon svg{width:100%;height:100%}.bubble{position:absolute;top:-40px;left:-60px;white-space:nowrap;background:#fff;border:2px solid #efa1b9;border-radius:24px;padding:7px 12px;font-size:12px;font-weight:800}.bottom{padding:12px 14px}.mission{border:3px solid #ffcc64;background:#fff7df;border-radius:18px;padding:12px}.mission h3{margin:0 0 6px;color:#e17a18}.nav{display:flex;justify-content:space-around;gap:6px;margin-top:12px}.nav button,.primary{border-radius:18px;padding:12px;background:#ff9d3a;color:#fff;font-weight:900;box-shadow:0 3px #db7c1c}.nav button{background:#fff;border:2px solid #84c6e6;color:#276b94;box-shadow:none;font-size:12px;flex:1}.screen{padding:20px 18px;min-height:90dvh;background:#fffdf4}.screen h1{color:#087dce;margin:6px 0;font-size:27px}.screen h2{color:#df781d}.hero{text-align:center;padding:32px 12px;background:linear-gradient(#c8edff,#f8f8d5);border-radius:24px}.hero svg{width:190px;height:220px}.card{border:3px solid #f7c76d;background:#fff9e9;border-radius:18px;padding:14px;margin:12px 0}.item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fff;border:2px solid #d8e8c4;border-radius:13px;margin:8px 0}.item button{border-radius:12px;padding:8px 12px;background:#1d9bd4;color:white;font-weight:bold}.item button:disabled{background:#b6c8bd}.wide{width:100%;margin:12px 0;padding:15px}.secondary{background:#fff;border:2px solid #f4a9bc;color:#a52e63;box-shadow:none}.event{text-align:center;border-radius:22px;padding:26px 12px;background:linear-gradient(#09184c,#284e88);color:#fff;min-height:360px}.event .sky{font-size:45px;letter-spacing:9px;margin:50px 0}.note{font-size:13px;line-height:1.8;color:#726458}.progress{font-size:14px;font-weight:bold;color:#3477a0} .title{font-weight:900;font-size:25px;color:#0876ca} .hidden{display:none} 
</style><link rel='stylesheet' href='/storybook.css'><link rel='stylesheet' href='/town-overlay.css'></head><body><div id="app"></div><script>
const KEY="kododora-v1";let state={chapter:0,items:{},done:{},stars:0,meal:'カレー',position:{x:360,y:360},seen:[],night:false};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY))||{})}catch{};let screen="home",hint="",worldX=-180,worldY=-140,drag=false,startX=0,startY=0;
const missions=[{name:"人形劇がはじまらない！？",desc:"こうえんまでに どうぐを あつめよう！",needs:[["🎎","にんぎょう","工作のおへや"],["🧵","ぶたいの ぬの","仕立て屋"],["🥁","たいこ","音楽ひろば"],["🔦","しょうめい","町の倉庫"]]},{name:"キャンプ場は大さわぎ！",desc:"みんなで おいしい ごはんを つくろう！",needs:[["🥕","にんじん","畑"],["🥔","じゃがいも","畑"],["🧅","たまねぎ","お店"],["🍛","カレールウ","お店"],["🪵","まき","森"],["🍲","おなべ","広場"]]}];
const places=[{id:"theater",name:"ドキドキ劇場",emoji:"🎭",x:85,y:85,bg:"#ffe0d5"},{id:"music",name:"音楽ひろば",emoji:"🎵",x:530,y:90,bg:"#ffe9a5"},{id:"craft",name:"工作のおへや",emoji:"✂️",x:90,y:530,bg:"#e4d5fc"},{id:"forest",name:"冒険の森",emoji:"🌳",x:530,y:530,bg:"#c2e9bd"},{id:"square",name:"みんなの広場",emoji:"🎪",x:310,y:600,bg:"#ffdcdb"},{id:"shop",name:"おみせ",emoji:"🏠",x:80,y:265,bg:"#fff0bd"},{id:"tailor",name:"仕立て屋さん",emoji:"🧵",x:300,y:245,bg:"#fbdce8"},{id:"storage",name:"まちの倉庫",emoji:"📦",x:530,y:280,bg:"#d5ebf4"},{id:"field",name:"やさい畑",emoji:"🥕",x:280,y:80,bg:"#e8e9a7"}];
const dragon='<img class="character" src="/assets/kodomo-dragon.jpg" alt="子どもドラゴン">' ;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function show(s){screen=s;render();window.scrollTo(0,0)}function el(s){document.getElementById("app").innerHTML=s}function btn(t,action,cls="primary"){return '<button class="'+cls+'" onclick="'+action+'">'+t+'</button>'}function current(){return missions[Math.min(state.chapter,1)]}function collected(){return current().needs.filter(i=>state.items[i[1]]).length}function total(){return current().needs.length}
function render(){if(screen==="home"){el('<div class="screen"><div class="hero"><div class="small">宇都宮子ども劇場</div><div class="title">子どもドラゴンの<br>ワクワクタウン</div>'+dragon+'<p>あそんで・てつだって・みんなでつくる！</p></div>'+btn("🌈 あそぶ","show(\'map\')","primary wide")+btn("📖 あそびかた","show(\'help\')","primary secondary wide")+'<p class="note">ゲーム内に広告・課金はありません。保存はこの端末内だけです。</p></div>');return}
if(screen==="map"){const m=current();el('<div class="top"><div class="brand">🐉 ワクワクタウン</div><div class="pill">⭐ '+state.stars+'</div></div><div class="map" id="map"><div class="world" id="world"><svg class="town-art" viewBox="0 0 780 780" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M2 5l4 -2m8 13l5 1m3 8l-3 1" stroke="#fff" opacity=".45" stroke-width="2"/></pattern></defs><rect width="780" height="780" fill="#c9e9a3"/><path d="M0 100Q150 65 260 130T530 105T780 135V0H0Z" fill="#9fdb8a"/><path d="M0 710Q160 640 290 702T780 675V780H0Z" fill="#a8da91"/><path d="M360 0Q405 135 390 250T398 520T390 780" stroke="#f5dca4" stroke-width="93" fill="none"/><path d="M0 395Q220 353 385 394T780 370" stroke="#f5dca4" stroke-width="76" fill="none"/><path d="M360 0Q405 135 390 250T398 520T390 780M0 395Q220 353 385 394T780 370" stroke="#e3ba7d" stroke-width="3" stroke-dasharray="8 15" fill="none"/><path d="M684 450Q650 510 685 550T730 730" stroke="#72c9ec" stroke-width="45" fill="none"/><path d="M684 450Q650 510 685 550T730 730" stroke="#ecffff" stroke-width="2" fill="none"/><g stroke="#34763e" stroke-width="3"><path d="M12 200l22-51 21 51Z" fill="#4aaf59"/><path d="M19 190l15-45 18 45Z" fill="#7fc956"/><path d="M210 16l23 58h-50Z" fill="#399d58"/><path d="M700 170l22-61 28 61Z" fill="#4caf57"/><path d="M16 555l24-63 28 63Z" fill="#52b858"/><path d="M245 610l27-70 28 70Z" fill="#4ea85b"/><path d="M705 315l24-66 27 66Z" fill="#48ac58"/></g><g fill="#f8d15b" stroke="#9b692c" stroke-width="4"><path d="M40 80h155v105H40Z"/><path d="M30 82l89-60 90 60Z" fill="#e96e56"/><path d="M560 83h165v110H560Z"/><path d="M545 85l95-62 98 62Z" fill="#f39b50"/><path d="M48 520h164v123H48Z"/><path d="M32 523l99-60 96 60Z" fill="#ab87d4"/><path d="M560 520h170v125H560Z"/><path d="M547 520l98-63 97 63Z" fill="#76b7d8"/></g><g fill="#fff" stroke="#86603c" stroke-width="3"><rect x="65" y="104" width="103" height="66" rx="4"/><rect x="588" y="102" width="106" height="73" rx="5"/><rect x="70" y="548" width="116" height="70" rx="5"/><rect x="580" y="546" width="128" height="72" rx="5"/></g><path d="M65 104h103v58H65Z" fill="#dc5e59"/><path d="M116 104v60" stroke="#f4c2a4" stroke-width="4"/><path d="M598 119h84" stroke="#75c0ec" stroke-width="11"/><path d="M82 560l24 28 24-28 24 28 24-28" stroke="#e889ad" stroke-width="9" fill="none"/><g fill="#fff8d5" stroke="#987a45" stroke-width="3"><path d="M305 575l50-80 50 80Z" fill="#f7ae60"/><path d="M364 575l42-75 42 75Z" fill="#f4d177"/></g><g fill="#ec6c74"><circle cx="300" cy="260" r="7"/><circle cx="490" cy="270" r="7"/><circle cx="258" cy="710" r="7"/></g><g fill="#ffe47c"><circle cx="310" cy="270" r="5"/><circle cx="500" cy="275" r="5"/><circle cx="265" cy="715" r="5"/></g><rect width="780" height="780" fill="url(#paper)"/></svg>'+Array.from({length:0},(_,i)=>'<span class="tree" style="left:'+((i*139+35)%730)+'px;top:'+((i*97+18)%730)+'px">🌲</span>').join("")+places.map(p=>'<button class="spot" style="left:'+p.x+'px;top:'+p.y+'px;background:'+p.bg+'" onclick="visit(\''+p.id+'\')"><span class="emoji">'+p.emoji+'</span>'+p.name+'</button>').join("")+'<div class="dragon" id="dragon" style="left:'+state.position.x+'px;top:'+state.position.y+'px">'+dragon+'<div class="bubble">いっしょに あそぼ！</div></div></div></div><div class="bottom"><div class="mission"><h3>📣 '+m.name+'</h3><div class="small">'+m.desc+'</div><p class="progress">あつめたもの '+collected()+' / '+total()+'</p>'+btn("ミッションをみる","show(\'mission\')","primary")+'</div><div class="nav">'+btn("🎒 もちもの","show(\'mission\')")+btn("✨ イベント","show(\'events\')")+btn("📖 ずかん","show(\'book\')")+btn("🏠 ホーム","show(\'home\')")+'</div></div>');const map=document.getElementById("map");map.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;startX=e.clientX;startY=e.clientY;map.setPointerCapture(e.pointerId)});map.addEventListener("pointermove",e=>{if(!drag)return;worldX=Math.max(-420,Math.min(0,worldX+e.clientX-startX));worldY=Math.max(-350,Math.min(0,worldY+e.clientY-startY));startX=e.clientX;startY=e.clientY;positionWorld()});map.addEventListener("pointerup",()=>drag=false);positionWorld();return}
if(screen==="cook"){el('<div class="screen"><h1>🍳 みんなで おりょうり</h1><div class="hero"><div style="font-size:80px">🏕️ 🍲 🥕</div><p>どんな ごはんに する？</p></div><div class="card"><h2>すきなものを えらぼう</h2>'+["カレー","やさいスープ","やきいも"].map((x,i)=>'<div class="item"><b>'+["🍛","🥣","🍠"][i]+' '+x+'</b><button onclick="chooseMeal('+i+')">'+(state.meal===x?"✅ これ！":"えらぶ")+'</button></div>').join("")+'<p class="note">ひを つかうときは、おとなと いっしょにね。</p></div><button class="primary wide" onclick="show(\'mix\')">🥄 まぜまぜ！</button><button class="primary secondary wide" onclick="show(\'mission\')">← もどる</button></div>');return}
if(screen==="mix"){el('<div class="screen"><h1>🥄 まぜまぜ クッキング</h1><div class="hero"><div style="font-size:90px" id="pot">🍲</div><h2>おなべを 5かい タップ！</h2><div class="progress" id="mixCount">0 / 5</div><p>みんなで おいしく つくろう！</p></div><button class="primary wide" onclick="stir()">🥄 まぜる！</button><button class="primary secondary wide" onclick="show(\'cook\')">← もどる</button></div>');return}
if(screen==="mission"){const m=current();el('<div class="screen"><h1>🎒 おてつだいメモ</h1><div class="card"><h2>'+m.name+'</h2><p>'+m.desc+'</p>'+m.needs.map(i=>'<div class="item"><span>'+i[0]+' '+i[1]+'<br><span class="small">📍 '+i[2]+'</span></span><b>'+(state.items[i[1]]?"✅":"❔")+'</b></div>').join("")+'</div>'+((collected()===total())?btn(state.chapter===1?"🍳 おりょうりしよう！":"🎉 じゅんびかんりょう！",state.chapter===1?"show(\'cook\')":"complete()","primary wide"):'<p class="note">町の建物をタップして、道具を探してね！</p>')+btn("← まちにもどる","show(\'map\')","primary secondary wide")+'</div>');return}
if(screen==="place"){const p=places.find(p=>p.id===hint);const candidates=current().needs.filter(i=>i[2]===({theater:"ドキドキ劇場",music:"音楽ひろば",craft:"工作のおへや",tailor:"仕立て屋",forest:"森",square:"広場",shop:"お店",storage:"町の倉庫",field:"畑"}[p.id]));el('<div class="screen"><h1>'+p.emoji+' '+p.name+'</h1><div class="hero"><div style="font-size:70px">'+p.emoji+'</div>'+dragon+'<p>なにか みつかるかな？</p></div><div class="card"><h2>🔎 さがしてみよう！</h2>'+(candidates.length?candidates.map(i=>'<div class="item"><span>'+i[0]+' '+i[1]+'</span>'+btn(state.items[i[1]]?"みつけた！":"さがす","pickup(\''+i[1]+'\')","primary")+'</div>').join(""):'<p>ここには すてきな けしきが あるよ！</p>')+'</div>'+btn("← まちにもどる","show(\'map\')","primary secondary wide")+'</div>');return}
if(screen==="events"){el('<div class="screen"><h1>✨ とくべつな よる</h1><p>町のみんなと、きれいな景色を楽しもう！</p><div class="card"><h2>🌠 ほしぞらかんさつ</h2><p>星をタップすると きらきらするよ。</p>'+btn("ほしぞらを みる","show(\'stars\')","primary wide")+'</div><div class="card"><h2>🎆 みんなの はなび</h2><p>空をタップして 花火をあげよう！</p>'+btn("はなびを みる","show(\'fireworks\')","primary wide")+'</div>'+btn("← まちにもどる","show(\'map\')","primary secondary wide")+'</div>');return}
if(screen==="stars"||screen==="fireworks"){let fw=screen==="fireworks";el('<div class="screen"><div class="event" onclick="spark(this,'+(fw?1:0)+')"><h2 style="color:white">'+(fw?"🎆 みんなでみる はなび！":"🌌 よるは ほしぞらかんさつ！")+'</h2><div class="sky" id="sky">'+(fw?"🎇 ✨ 🎆":"✦ ⭐ ✧ 🌟")+'</div><div style="font-size:70px">🐉 👧 🧒</div><p>そらを タップしてみよう！</p></div>'+btn("← まちにもどる","show(\'map\')","primary secondary wide")+'</div>');return}
if(screen==="book"){el('<div class="screen"><h1>📖 ワクワクずかん</h1><div class="card"><h2>あそんだ きろく</h2><p>⭐ ワクワク：'+state.stars+'</p><p>🎭 人形劇：'+(state.done[0]?"だいせいこう！":"これから")+'</p><p>🏕️ キャンプ：'+(state.done[1]?"だいせいこう！":"これから")+'</p></div><div class="card"><h2>おうちのひとへ</h2><p>宇都宮子ども劇場では、人形劇・音楽・自然体験などを通じて子どもと大人が一緒に楽しむ活動をしています。</p>'+btn("公式サイトを見る","if(confirm(\'おうちの人といっしょに外部サイトを開きますか？\'))location.href=\'https://www.ukg.jp/\'","primary wide")+'</div>'+btn("← まちにもどる","show(\'map\')","primary secondary wide")+'</div>');return}
if(screen==="help"){el('<div class="screen"><h1>📖 あそびかた</h1><div class="card"><p>① 町の建物をタップして、ドラゴンを動かそう。</p><p>② みんなのお手伝いをして、道具を集めよう。</p><p>③ 全部そろったら、ミッションを完成させよう！</p><p>④ 星空や花火も見てみよう！</p></div>'+btn("あそぶ！","show(\'map\')","primary wide")+'</div>');return}}
function positionWorld(){let w=document.getElementById("world");if(w)w.style.transform='translate('+worldX+'px,'+worldY+'px)'}
function visit(id){let p=places.find(p=>p.id===id);state.position={x:p.x+42,y:p.y+115};save();let d=document.getElementById("dragon");if(d){d.style.left=state.position.x+"px";d.style.top=state.position.y+"px"}hint=id;setTimeout(()=>show("place"),520)}
function pickup(name){if(!state.items[name]){state.items[name]=true;state.stars+=1;save()}render()}
let stirCount=0;function chooseMeal(i){state.meal=["カレー","やさいスープ","やきいも"][i];save();show("cook")}function stir(){stirCount++;document.getElementById("mixCount").textContent=Math.min(5,stirCount)+" / 5";document.getElementById("pot").textContent=stirCount%2?"🍲":"🥘";if(stirCount>=5){stirCount=0;complete()}}function complete(){if(collected()!==total()){show("mission");return}if(!state.done[state.chapter])state.stars+=5;state.done[state.chapter]=true;if(state.chapter===0)state.chapter=1;save();let title=state.done[1]?"キャンプの"+state.meal+"ができた！":"人形劇は大成功！";el('<div class="screen"><div class="hero"><h1>🎉 '+title+'</h1>'+dragon+'<p>みんなの えがおが いっぱい！</p><p>⭐ ワクワクが ふえたよ！</p></div>'+btn("🌈 まちにもどる","show(\'map\')","primary wide")+btn("✨ とくべつなよる","show(\'events\')","primary secondary wide")+'</div>')}
function spark(node,fw){const sky=document.getElementById("sky");sky.textContent=fw?["🎆 💥 🎇 ✨","✨ 🎇 💖 🎆","🎆 🌟 🎆 🎇"][Math.floor(Math.random()*3)]:["🌟 ✨ ⭐ ✧","🌠 ✨ 🌌 ⭐","⭐ ✦ 💫 ✨"][Math.floor(Math.random()*3)]}
render();
</script><script src="/adventure.js"></script><script src="/controls.js"></script><script src="/world.js"></script><script src="/town-overlay.js"></script></body></html>
